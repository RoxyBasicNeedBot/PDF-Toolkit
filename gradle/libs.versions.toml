[versions]
# Roxy PDF Toolkit Version
roxy-version-name = "1.0.0"
roxy-version-code = "1"

# Android & Kotlin
agp = "8.7.2"
kotlin = "2.1.0"
ksp = "2.1.0-1.0.29"

# Compose Multiplatform
compose-multiplatform = "1.7.1"
compose-compiler = "2.1.0"
material3-expressive = "1.3.1"
androidx-activity-compose = "1.9.3"
androidx-lifecycle = "2.8.4"

# Liquid Glass & Backdrops
kyant-backdrop = "2.0.0"
kyant-shapes = "1.2.0"
haze = "1.1.1"

# PDF Engine (Clean Android & JVM)
pdfbox-android = "2.0.27.0"

# CameraX
camerax = "1.4.0"

# Machine Learning & Document Scanner
tensorflow-lite = "2.16.1"
mlkit-document-scanner = "16.0.0-beta1"

# Dependency Injection & Async
koin = "4.0.0"
coroutines = "1.9.0"
kotlinx-datetime = "0.6.1"

# Image Loading & UI Utilities
coil3 = "3.0.4"

# Firebase & Crash Tracking (Crashlytics + Analytics + NDK)
firebase-bom = "33.8.0"
google-services = "4.4.2"
firebase-crashlytics-gradle = "3.0.3"

[libraries]
# Firebase
firebase-bom = { module = "com.google.firebase:firebase-bom", version.ref = "firebase-bom" }
firebase-crashlytics = { module = "com.google.firebase:firebase-crashlytics" }
firebase-crashlytics-ndk = { module = "com.google.firebase:firebase-crashlytics-ndk" }
firebase-analytics = { module = "com.google.firebase:firebase-analytics" }
# Compose Multiplatform & UI
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }

# Liquid Glass Shaders (Kyant Backdrop)
kyant-backdrop = { module = "io.github.kyant0:backdrop", version.ref = "kyant-backdrop" }
kyant-shapes = { module = "io.github.kyant0:shapes", version.ref = "kyant-shapes" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }

# PDF Processing
pdfbox-android = { module = "com.tom-roush:pdfbox-android", version.ref = "pdfbox-android" }

# CameraX
androidx-camera-core = { module = "androidx.camera:camera-core", version.ref = "camerax" }
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }

# Machine Learning & Document Scanner (TFLite + ML Kit)
tensorflow-lite = { module = "org.tensorflow:tensorflow-lite", version.ref = "tensorflow-lite" }
tensorflow-lite-gpu = { module = "org.tensorflow:tensorflow-lite-gpu", version.ref = "tensorflow-lite" }
mlkit-document-scanner = { module = "com.google.android.gms:play-services-mlkit-document-scanner", version.ref = "mlkit-document-scanner" }

# Coroutines & Architecture
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-datetime = { module = "org.jetbrains.kotlinx:kotlinx-datetime", version.ref = "kotlinx-datetime" }

# Koin
koin-core = { module = "io.insert-koin:koin-core", version.ref = "koin" }
koin-android = { module = "io.insert-koin:koin-android", version.ref = "koin" }
koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koin" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koin" }

# Coil 3 Image Loading
coil-compose = { module = "io.coil-kt.coil3:coil-compose", version.ref = "coil3" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
google-services = { id = "com.google.gms.google-services", version.ref = "google-services" }
firebase-crashlytics = { id = "com.google.firebase.crashlytics", version.ref = "firebase-crashlytics-gradle" }
